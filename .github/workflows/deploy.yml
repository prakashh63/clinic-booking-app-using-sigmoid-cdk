name: Deploy Clinic Booking

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [dev, staging, prod]
        required: true

permissions:
  contents: read

concurrency:
  group: clinic-booking-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUCKET_SUFFIX: ${{ vars.BUCKET_SUFFIX || 'demo' }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt && npm install -g aws-cdk

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Deploy infrastructure
        run: cdk deploy --all --require-approval never

      - name: Upload frontend to S3
        run: aws s3 sync src/frontend/ "s3://clinic-booking-web-${STAGE}-${BUCKET_SUFFIX}/"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stack-resources \
            --stack-name "sigmoid-clinic-booking-${STAGE}" \
            --query "StackResources[?ResourceType=='AWS::CloudFront::Distribution'].PhysicalResourceId" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Show site URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name "sigmoid-clinic-booking-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" \
            --output text
