name: Destroy Clinic Booking

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to destroy
        type: choice
        options: [dev, staging]
        required: true
      confirmation:
        description: Type DESTROY dev or DESTROY staging
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: clinic-booking-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUCKET_SUFFIX: ${{ vars.BUCKET_SUFFIX || 'demo' }}
    steps:
      - name: Confirm destruction
        run: |
          [[ "$CONFIRMATION" == "DESTROY $STAGE" ]] || { echo "Incorrect confirmation"; exit 1; }
          [[ "$STAGE" == dev || "$STAGE" == staging ]] || exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt && npm install -g aws-cdk

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Empty website S3 bucket
        run: |
          STACK="sigmoid-clinic-booking-${STAGE}"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue | [0]" \
            --output text)
          [[ "$BUCKET" == "clinic-booking-web-${STAGE}-"* ]] || { echo "Unexpected website bucket"; exit 1; }
          aws s3 rm "s3://${BUCKET}/" --recursive

      - name: Destroy infrastructure
        run: cdk destroy --all --force