name: CI — test and audit CDK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGE: dev
      BUCKET_SUFFIX: cidemo
      SENDER_EMAIL: clinic@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python and CDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          npm install --global aws-cdk
      - name: Check versions and Python/JavaScript syntax
        run: |
          python --version
          node --version
          python -m compileall -q bin src tests tools scripts
          node --check src/frontend/assets/app.js
      - name: Test business logic and infrastructure config
        run: python -m pytest -q
      - name: Synthesize (no AWS deployment)
        run: cdk synth --quiet
      - name: Review inputs against cdk.out
        run: python scripts/review_cdk_output.py --stage dev
